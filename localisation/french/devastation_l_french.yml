 # =====================================================================
 # WARFARE CONDUCT CATEGORY & DECISIONS
 # =====================================================================
 bm_warfare_conduct_category: "§YConduite de la guerre§!"
 bm_warfare_conduct_category_desc: "Directives régissant la manière dont votre armée traite les §Ypopulations civiles§! dans les territoires contestés.\n\nUne conduite plus §Gretenue§! réduit les §Rpertes civiles§!, ralentit la §Rdévastation§! et préserve le §Gprestige international§!.\nUne conduite plus §Ragressive§! accélère votre progression au prix d'un §Rcoût humanitaire et logistique constant§!.\n\nLa §Yposition actuellement active§! est grisée."

 bm_conduct_humanitarian: "§CConduite humanitaire§!"
 bm_conduct_humanitarian_desc: "Donner des ordres absolus afin de protéger la vie des civils. Les bombardements près des zones peuplées sont interdits. Les unités médicales accompagnent chaque avancée.\n\n§YEffets de combat :§!\nVitesse de l'armée §R-15%§!\nAttrition §R+8%§!\nVitesse de planification §R-10%§!\nAttaque légère §R-10%§!\nVitesse de retranchement §R-5%§!\nDéfense §G+5%§!\nOrganisation maximale §G+5§!\nTaux de renfort §G+5%§!\nPerte d'organisation en mouvement §G-5%§!\nConsommation de ravitaillement §R+10%§! (ravitaillement des prisonniers et logistique civile)\n\n§YEffets d'occupation :§!\nGain mensuel d'opinion §G+40%§!\nLes ennemis mettent §G40%§! plus de temps à justifier une guerre contre vous\nLa résistance dans les États occupés §Gdiminue§!\nCroissance de la conformité §G+10%§!\nPouvoir politique par jour §G+0.10§!\n\n§YLors de la sélection :§!\nStabilité §G+10%§!\nSoutien à la guerre §R-20%§! (les généraux s'opposent à l'ordre)\n\n§YImpact civil :§!\nTaux de mortalité civile §G×0.25§!\nGain de dévastation §G×0.70§!"

 bm_conduct_pacifist: "§GConduite pacifiste§!"
 bm_conduct_pacifist_desc: "Donner des ordres stricts afin de minimiser toutes les pertes civiles. Les soldats évitent les zones peuplées et traitent humainement les civils capturés.\n\n§YEffets de combat :§!\nVitesse de l'armée §R-10%§!\nAttrition §R+5%§!\nAttaque légère §R-5%§!\nVitesse de retranchement §R-5%§!\nDéfense §G+3%§!\nOrganisation maximale §G+3§!\nTaux de renfort §G+3%§!\nPerte d'organisation en mouvement §G-3%§!\nConsommation de ravitaillement §R+5%§!\n\n§YEffets d'occupation :§!\nGain mensuel d'opinion §G+25%§!\nLes ennemis mettent §G20%§! plus de temps à justifier une guerre contre vous\nLa résistance dans les États occupés §Gdiminue légèrement§!\nCroissance de la conformité §G+5%§!\nPouvoir politique par jour §G+0.05§!\n\n§YLors de la sélection :§!\nStabilité §G+5%§!\n\n§YImpact civil :§!\nTaux de mortalité civile §G×0.50§!\nGain de dévastation §G×0.85§!"

 bm_conduct_restrained: "§LConduite retenue§!"
 bm_conduct_restrained_desc: "Maintenir des règles d'engagement disciplinées afin de limiter les dommages collatéraux lorsque cela est possible.\n\n§YEffets de combat :§!\nVitesse de l'armée §R-5%§!\nAttrition §R+2%§!\nDéfense §G+2%§!\nOrganisation maximale §G+2§!\nTaux de renfort §G+2%§!\nConsommation de ravitaillement §R+2%§!\n\n§YEffets d'occupation :§!\nGain mensuel d'opinion §G+10%§!\nLes ennemis mettent §G10%§! plus de temps à justifier une guerre contre vous\nLa résistance dans les États occupés §Gdiminue légèrement§!\nCroissance de la conformité §G+3%§!\n\n§YImpact civil :§!\nTaux de mortalité civile §G×0.75§!\nGain de dévastation §G×0.90§!"

 bm_conduct_standard: "Conduite standard§!"
 bm_conduct_standard_desc: "Appliquer les règles d'engagement ordinaires en temps de guerre. Les pertes civiles ne sont pas délibérément recherchées, mais la nécessité opérationnelle prime lorsque la situation l'exige.\n\nIl s'agit de la §Yposture par défaut§! — aucune restriction particulière, aucune autorisation particulière.\n\n§YImpact civil :§!\nTaux de mortalité civile §Y×1.00§!\nGain de dévastation §Y×1.00§! — référence"

 bm_conduct_aggressive: "§YConduite agressive§!"
 bm_conduct_aggressive_desc: "Privilégier la vitesse opérationnelle à la prudence humanitaire. L'artillerie et l'appui aérien sont utilisés librement, quelle que soit la proximité des zones civiles.\n\n§YEffets de combat :§!\nVitesse de l'armée §G+5%§!\nPercée §G+5%§!\nAttrition §G-5%§!\nAttaque légère §G+5%§!\nVitesse de retranchement §G+5%§!\nRépression §G+10§!\nGain d'expérience §G+5%§!\nOrganisation maximale §R-2§!\nConsommation de ravitaillement §R+10%§! (forte consommation de munitions)\n\n§YEffets d'occupation :§!\nGain mensuel d'opinion §R-15%§!\nLa génération de tension liée aux objectifs de guerre coûte §G10%§! de moins\nLes ennemis mettent §R10%§! de temps en moins à justifier une guerre contre vous\nLa résistance dans les États occupés §Raugmente§!\nCroissance de la conformité §R-5%§!\nPouvoir politique par jour §R-0.05§!\nToutes les nations : opinion de vous §R-30§!\n\n§YLors de la sélection :§!\nSoutien à la guerre §R-5%§!\n\n§YImpact civil :§!\nTaux de mortalité civile §R×1.25§!\nGain de dévastation §R×1.15§!"

 bm_conduct_total_war: "§OConduite de guerre totale§!"
 bm_conduct_total_war_desc: "Toute retenue est abandonnée. Les infrastructures civiles deviennent des cibles militaires légitimes. La terreur est utilisée comme un outil de guerre.\n\n§YEffets de combat :§!\nVitesse de l'armée §G+10%§!\nPercée §G+10%§!\nAttrition §G-5%§!\nAttaque légère §G+10%§!\nVitesse de retranchement §G+10%§!\nRépression §G+20§!\nGain d'expérience §G+10%§!\nOrganisation maximale §R-5§!\nConsommation de ravitaillement §R+20%§! (opérations sans relâche)\n\n§YEffets d'occupation :§!\nGain mensuel d'opinion §R-30%§!\nLa génération de tension liée aux objectifs de guerre coûte §G20%§! de moins\nLes ennemis mettent §R20%§! de temps en moins à justifier une guerre contre vous\nSoutien à la guerre §R-1%§! par semaine\nLa résistance dans les États occupés §Raugmente fortement§!\nCroissance de la conformité §R-10%§!\nPouvoir politique par jour §R-0.05§!\nToutes les nations : opinion de vous §R-60§!\n\n§YLors de la sélection :§!\nSoutien à la guerre §R-10%§!\nStabilité §R-5%§!\n\n§YImpact civil :§!\nTaux de mortalité civile §R×1.50§!\nGain de dévastation §R×1.30§!"

 bm_conduct_scorched_earth: "§RTerre brûlée§!"
 bm_conduct_scorched_earth_desc: "Destruction systématique de tout. Aucune pitié, aucune infrastructure laissée debout. L'ennemi hérite de ruines — et vous aussi.\n\n§YEffets de combat :§!\nVitesse de l'armée §G+15%§!\nPercée §G+15%§!\nAttrition §G-10%§!\nAttaque légère §G+15%§!\nVitesse de retranchement §G+15%§!\nRépression §G+30§!\nGain d'expérience §G+15%§!\nOrganisation maximale §R-10§!\nConsommation de ravitaillement §R+30%§! (destruction de votre propre logistique future)\n\n§YEffets d'occupation :§!\nGain mensuel d'opinion §R-50%§!\nLa génération de tension liée aux objectifs de guerre coûte §G30%§! de moins\nLes ennemis mettent §R40%§! de temps en moins à justifier une guerre contre vous\nSoutien à la guerre §R-1%§! par semaine\nLa résistance dans les États occupés §Rbascule en révolte ouverte§!\nCroissance de la conformité §R-20%§!\nPouvoir politique par jour §R-0.10§!\nToutes les nations : opinion de vous §R-100§!\n\n§YLors de la sélection :§!\nSoutien à la guerre §R-15%§!\nStabilité §R-10%§!\nPouvoir politique §R-30§!\n\n§YImpact civil :§!\nTaux de mortalité civile §R×2.00§!\nGain de dévastation §R×1.60§!"

