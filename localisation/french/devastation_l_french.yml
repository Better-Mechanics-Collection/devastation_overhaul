l_french:

 # Decisions
 devastation_decisions: "Réduction de la dévastation"
 devastation_decisions_desc: "Réduire la dévastation des États est essentiel à la fois pour la résilience en temps de guerre et pour la paix à long terme. En période de guerre, limiter la dévastation aide à maintenir la stabilité nationale, protéger le moral des civils et garantir le bon fonctionnement des infrastructures critiques. En temps de paix, traiter les conséquences de la dévastation est vital pour la reprise économique, le bien-être de la population et la prévention de futures instabilités, permettant à la nation de prospérer et de se reconstruire plus efficacement."
 
 devastation_emergency_repairs: "Réparations d'urgence"
 devastation_emergency_repairs_desc: "Envoyer des équipes de réparation afin de restaurer les infrastructures essentielles, telles que les routes, les ponts et les lignes électriques, pour maintenir l'effort de guerre."
 devastation_evacuation_orders: "Ordres d'évacuation"
 devastation_evacuation_orders_desc: "Mettre en œuvre l'évacuation massive des civils des zones fortement bombardées ou pilonnées afin de réduire les pertes et maintenir le moral."
 devastation_rapid_response_teams: "Équipes d'intervention rapide"
 devastation_rapid_response_teams_desc: "Déployer des équipes d'intervention rapide pour contenir et contrôler les dégâts immédiatement après les frappes ennemies, en se concentrant sur la lutte contre les incendies, l'aide médicale et le génie d'urgence."
 devastation_national_infrastructure_investment: "Réinvestissement national dans les infrastructures"
 devastation_national_infrastructure_investment_desc: "Investir dans la reconstruction des infrastructures critiques afin de restaurer les réseaux de transport et les services publics dans les États dévastés."
 devastation_relief_fund_allocation: "Allocation de fonds de secours"
 devastation_relief_fund_allocation_desc: "Allouer des fonds afin de fournir une aide immédiate et des ressources aux régions les plus touchées."
 devastation_public_works_initiative: "Programme de travaux publics"
 devastation_public_works_initiative_desc: "Lancer un vaste programme de travaux publics visant à employer les chômeurs pour reconstruire les zones dévastées."
 devastation_funding_allies: "Financement des réparations de §Y[FROM.GetAdjective]§!"
 devastation_funding_allies_desc: "Envoyer de l'aide à nos alliés §Y[FROM.GetAdjective]§! afin de réparer les dévastations dans leurs États."
 devastation_funding_allies_tt: "§RAucun État dévasté chez §Y[FROM.GetAdjective]§! !§!"
 devastation_funding_allies_cancel_trigger: "L'opinion de [FROM.GetFlag] §Y[FROM.GetNameDefCap]§! est inférieure à §Y50§! et n'est pas un allié de [ROOT.GetFlag] §Y[ROOT.GetNameDefCap]§!"
 
 
 assimilation_decisions: "Populations déplacées"
 assimilation_decisions_desc: "Alors que la dévastation se propage à travers le pays, les §Ypopulations§! sont déracinées de leurs foyers et de leurs moyens de subsistance. Ces §Ycivils déplacés§!, qu'ils fuient la destruction à l'intérieur de nos frontières ou qu'ils arrivent depuis l'étranger, sont regroupés dans notre réserve de §OPopulation non assimilée§!.\n\nCes populations ne sont pas encore pleinement réintégrées dans la structure économique et administrative de l'État. Avec le temps, nous pouvons les §Gréintégrer§! à notre population principale grâce à une reprise naturelle ou à des efforts politiques ciblés. Alternativement, si le fardeau devient trop important, nous pouvons choisir de les §Rexpulser de force§! au-delà de nos frontières...\n\nActuellement, nous possédons une §OPopulation non assimilée§! totale de §R[?country_unassimilated_pops|2]K§!, représentant §Y[CountryUnassimilatedPopsRatio]§! de notre §Cpopulation centrale§! de §C[?country_core_population_controlled]K§!.\n\nPour chaque tranche de §Y0.1%§! de ce ratio, nous subissons un malus de §R[?global.unassimilated_stability_factor]%§! à la §YStabilité§!. À l'heure actuelle, cela représente une pénalité totale de [?country_unassimilated_pops_modifier^0|+2%] au §Yfacteur de stabilité§!.\n\nDepuis le début de la partie, un total de §Y[?total_external_refugees_in_game|2]K§! de §Ocivils déplacés internes et externes§! ont été enregistrés dans notre nation, dont §G[?total_external_refugees_assimilated_in_game|2]K§! ont été §Gréintégrés§! et §R[?total_external_refugees_expelled_in_game|2]K§! ont été §Rexpulsés de force§!.\n\nSi vous êtes en paix et voisin de nations en guerre, il est très probable que vous accueilliez des réfugiés externes ; et si vous êtes en guerre, perdez du terrain ou subissez des bombardements actifs, il est plus que probable que vous ayez des réfugiés internes."

 assimilation_passive_decision: "Réintégration passive de la population"
 assimilation_passive_decision_desc: "Avec le temps, les populations déplacées et non assimilées se réintégreront progressivement dans la société à mesure que les logements seront restaurés et que l'ordre administratif reviendra."
 assimilation_passive_decision_tt: "Une quantité aléatoire de §OPopulations non assimilées§! comprise entre §Y[?assimilate_unassimilated_pops_min|0%]§! et §Y[?assimilate_unassimilated_pops_max|0%]§! dans chaque État possédant des §OPopulations non assimilées§! sera §Gréintégrée§!.\n\n"

 assimilation_nationwide_drive_decision: "Campagne nationale de réintégration"
 assimilation_nationwide_drive_decision_desc: "Lancer un effort national coordonné afin de réintégrer les populations déplacées et non assimilées dans tous les États contrôlés."
 assimilation_nationwide_drive_decision_tt: "Une quantité aléatoire de §OPopulations non assimilées§! comprise entre §Y[?assimilate_unassimilated_pops_min|0%]§! et §Y[?assimilate_unassimilated_pops_max|0%]§! dans chaque État possédant des §OPopulations non assimilées§! sera §Gréintégrée§!.\n\n"

 assimilation_expel_decision: "Expulsion forcée des populations"
 assimilation_expel_decision_desc: "Purger l'appareil d'État des populations déplacées en expulsant de force les civils non assimilés au-delà de nos frontières."
 assimilation_expel_decision_tt: "Une quantité aléatoire de §OPopulations non assimilées§! comprise entre §Y[?assimilate_expel_pops_min|0%]§! et §Y[?assimilate_expel_pops_max|0%]§! dans chaque État possédant des §OPopulations non assimilées§! sera §Rexpulsée§!.\n\n"

 
 
