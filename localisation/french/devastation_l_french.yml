 devastation_massive_carpet_bombing_limited_victim_tt: "§YRaid de bombardement ennemi§!\nNotre État a subi des dégâts modérés à cause des bombardements ennemis. Certaines infrastructures et usines ont été détruites. Des pertes civiles sont signalées."
 devastation_massive_carpet_bombing_success_victim_tt: "§RAttaque dévastatrice !§!\nLes bombardiers ennemis ont causé de graves dégâts à nos infrastructures et à notre industrie. Lourdes pertes civiles. Moral national ébranlé."
 devastation_massive_carpet_bombing_critical_victim_tt: "§R§HCatastrophe de tempête de feu§!§!\nUn raid de bombardement apocalyptique a dévasté la région. Pertes civiles massives. Infrastructures totalement détruites. La production à travers la nation est perturbée. Cet événement restera comme l'un des jours les plus sombres de la guerre."
 
 
