 # REFUGEE POLICY CATEGORY & DECISIONS
 # =====================================================================
 bm_refugee_policy_category: "§YPolitique des réfugiés en temps de guerre§!"
 bm_refugee_policy_category_desc: "Détermine le degré d'ouverture de vos frontières aux §Ycivils déplacés§! fuyant la guerre.\n\nLes politiques §Gaccueillantes§! absorbent davantage de réfugiés, mais pèsent sur votre §Réconomie et votre main-d'œuvre§!.\nLes frontières §Rfermées§! préservent les ressources, mais vous §Risolent diplomatiquement§! et nourrissent les §Rtroubles dans les territoires occupés§!.\n\nLa §Ypolitique actuellement active§! est grisée."

 bm_refugees_open: "§CPolitique de la porte ouverte§!"
 bm_refugees_open_desc: "Frontieres ouvertes et accueil organise des civils deplaces.\n\n§YEffets dynamiques:§!\nAcceptation §Gx1.35§!\nCapacite §Y30%§! de la population nationale\nPression sur la stabilite §Gx0.70§!\nCharge administrative/biens de consommation §Rx1.25§!\nAssimilation §Gx1.25§!\n\nPlus de bonus magique de stabilite: les gains viennent de meilleure integration."

 bm_refugees_open_door: "§CPolitique de la porte ouverte§!"
 bm_refugees_open_door_desc: "Frontieres ouvertes et accueil organise des civils deplaces.\n\n§YEffets dynamiques:§!\nAcceptation §Gx1.35§!\nCapacite §Y30%§! de la population nationale\nPression sur la stabilite §Gx0.70§!\nCharge administrative/biens de consommation §Rx1.25§!\nAssimilation §Gx1.25§!\n\nPlus de bonus magique de stabilite: les gains viennent de meilleure integration."

 bm_refugees_welcoming: "§GPolitique accueillante§!"
 bm_refugees_welcoming_desc: "Les refugies sont acceptes par un systeme organise mais plus limite.\n\n§YEffets dynamiques:§!\nAcceptation §Gx1.15§!\nCapacite §Y25%§! de la population nationale\nPression sur la stabilite §Gx0.85§!\nCharge administrative/biens de consommation §Yx1.00§!\nAssimilation §Gx1.10§!"

 bm_refugees_neutral: "Politique neutre§!"
 bm_refugees_neutral_desc: "Controle frontalier standard en temps de guerre. Les refugies peuvent entrer normalement, sans mesures speciales.\n\n§YEffets dynamiques:§!\nAcceptation §Yx1.00§!\nCapacite §Y20%§! de la population nationale\nPression sur la stabilite §Yx1.00§!\nCharge administrative/biens de consommation §Gx0.70§!\nAssimilation §Yx1.00§!"

 bm_refugees_discouraging: "§YPolitique dissuasive§!"
 bm_refugees_discouraging_desc: "Les controles sont renforces et l accueil est limite. Moins de gens entrent, mais la repression et la souffrance visible creent de la tension.\n\n§YEffets dynamiques:§!\nAcceptation §Rx0.65§!\nCapacite §Y12%§! de la population nationale\nPression sur la stabilite §Rx1.20§!\nCharge administrative/biens de consommation §Gx0.35§!\nAssimilation §Rx0.75§!"

 bm_refugees_closed_borders: "§RFrontières fermées§!"
 bm_refugees_closed_borders_desc: "Les frontieres sont fermees aux mouvements normaux de refugies. Les ressources sont preservees, mais la repression et l isolement creent de la pression politique et de la resistance.\n\n§YEffets dynamiques:§!\nAcceptation §Rx0.10§!\nCapacite §Y5%§! de la population nationale\nPression sur la stabilite §Rx1.45§!\nCharge administrative/biens de consommation §Gx0.15§!\nAssimilation §Rx0.50§!"

 bm_refugees_closed: "§RFrontières fermées§!"
 bm_refugees_closed_desc: "Les frontieres sont fermees aux mouvements normaux de refugies. Les ressources sont preservees, mais la repression et l isolement creent de la pression politique et de la resistance.\n\n§YEffets dynamiques:§!\nAcceptation §Rx0.10§!\nCapacite §Y5%§! de la population nationale\nPression sur la stabilite §Rx1.45§!\nCharge administrative/biens de consommation §Gx0.15§!\nAssimilation §Rx0.50§!"

